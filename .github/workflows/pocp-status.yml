# The trusted reporter (docs/STATUS.md): sets the "pocp" commit status on a pull request's head.
#
# It runs with a token that can write statuses, also for pull requests from forks, so it must
# never check out, download or run anything from a pull request. It checks out only the default
# branch and runs `pocp status-report` from there, which reads GitHub's API: the pull request's
# head, labels and diff, and the runs of pocp.yml. A run's results count only when the pull
# request changes no CI file (a pull request runs its own copy of pocp.yml).
#
# workflow_run: when a pocp run finishes. pocp.yml runs on every push, retarget and approval
# label, so that covers each change (no pull_request_target, which GitHub blocks by default in
# public repositories). The reporter removes the approval labels it finds stale, with github.token.
name: pocp-status
on:
  workflow_run:
    workflows: [pocp]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write   # only github.token's, to remove the approval labels it finds stale
  statuses: write
jobs:
  report:
    # One at a time per head, none cancelled: each recomputes from scratch, so the last one wins.
    concurrency:
      group: pocp-status-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    # The reporter's own identity (docs/STATUS.md): the App's key lives in this environment,
    # limited to the default branch, so only this job can post as the App.
    environment: pocp-reporter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false   # no cache restore in a job that can write statuses
      - id: app
        if: vars.POCP_REPORTER_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.POCP_REPORTER_CLIENT_ID }}
          private-key: ${{ secrets.POCP_REPORTER_KEY }}
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-statuses: write
      - name: report
        run: node bin/pocp.js status-report
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          LABELS_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
