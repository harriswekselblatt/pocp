# The trusted reporter (docs/STATUS.md): sets the "pocp" commit status on a pull request's head.
#
# It runs with a token that can write statuses, also for pull requests from forks, so it must
# never check out, download or run anything from a pull request. It checks out only the default
# branch and runs `pocp status-report` from there, which reads GitHub's API: the pull request's
# head, labels and diff, and the runs of pocp.yml. A run's results count only when the pull
# request changes no CI file (a pull request runs its own copy of pocp.yml).
#
# workflow_run: when a pocp run finishes. pull_request_target: when the head or the labels
# change, so a removed approval or a new push is reflected without waiting for a run.
name: pocp-status
on:
  workflow_run:
    workflows: [pocp]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]   # edited: a retarget changes the base that judges it
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write
jobs:
  report:
    # Skipped (no Actions minutes) for events that can't change the status: a label other than
    # pocp-approve-*, or an edit that doesn't change the base. Pushes, retargets, approval labels
    # and finished verify runs always report.
    if: github.event_name != 'pull_request_target' || ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || startsWith(github.event.label.name, 'pocp-approve-')) && (github.event.action != 'edited' || github.event.changes.base)
    # One at a time per head, none cancelled: each recomputes from scratch, so the last one wins.
    concurrency:
      group: pocp-status-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      cancel-in-progress: false
    # The reporter's own identity (docs/STATUS.md): the App's key lives in this environment,
    # limited to the default branch, so only this job can post as the App.
    environment: pocp-reporter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false   # no cache restore in a job that can write statuses
      - id: app
        if: vars.POCP_REPORTER_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.POCP_REPORTER_CLIENT_ID }}
          private-key: ${{ secrets.POCP_REPORTER_KEY }}
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-statuses: write
      - name: report
        run: node bin/pocp.js status-report
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
