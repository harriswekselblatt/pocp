# POCP verifying its own pull requests with the POCP from the base branch: a change to the
# verifier is judged by the verifier it would replace, never by its own code. The pull request
# is checked out in pr/ and the base commit in verifier/; only verifier/bin/pocp.js runs verify.
# Approval labels are passed with the head's sha; verify (--label-freshness) asks GitHub whether
# each was applied by a writer after this head first ran, or carries over to a clean merge of the
# base. The token for that is read-only and set on the verify step alone.
#
# The pull request's code still runs: verify re-runs its checks. With --isolate (used whenever
# the base branch's verifier supports it), each check runs as a fresh unprivileged Linux user
# created for that one run: it can't write verifier/, pr/ or its .proof run records, can't read
# or write RUNNER_TEMP (where the step's output files are) or $HOME, never sees a token, can't
# signal verify, and everything it starts is killed when it ends. If that can't be set up,
# verify fails; it never falls back to running checks as this job's user. docs/THREAT-MODEL.md
# says exactly what this does and doesn't cover.
#
# The job's steps tell the trusted reporter (pocp-status.yml, docs/STATUS.md) what verify found:
# "verified" runs only when the verify step itself exited 0; otherwise exactly one of waiting /
# inconclusive / failed runs. An approval-* step runs for each approval passed to verify. The
# reporter trusts these steps only when the pull request changes no CI file.
#
# Green comes from verify's exit status (the step's outcome), or from a wait for a test-change
# approval whose label is given. The step's outputs (`code`, `needs`) only choose between
# waiting, inconclusive and failed, and the pending text: a line printed during the step can set
# them. The `approvable` step comes from a file verify writes in the runner's temp folder
# (--approval-file), only when the checks were isolated (decided by the `plan` step before any
# of the pull request's code runs; isolated checks can't reach that folder) and the wait is for
# pocp-approve-tests only. The `mark` step reads it and prints nothing of the pull request's.
# The reporter turns such a wait green once the label is given by a writer, without running
# verify again.
#
# On a pocp-approve-tests label (with POCP_STATUS_LIVE), the job's first steps ask the
# reporter's own code whether it would now turn the status green from the run already waiting
# (status-report --predict-approval). If so, the rest of the job is skipped: nothing would
# change. If not, or on any doubt, verify runs as before. That decides only whether verify runs;
# the reporter decides the status, from GitHub's data, after this run completes.
#
# POCP_STATUS_LIVE (a repository variable, set by an admin; a pull request can't change it):
# - unset: waiting and inconclusive still fail the job, as before, because "verify" is the
#   required check. Every label event runs verify (a job skipped by a label filter would show
#   as a skipped check, and GitHub counts a skipped required check as passing).
# - 'true': the "pocp" status is the required check. Waiting and inconclusive pass the job
#   (no red, no failure email), and label events other than pocp-approve-* are ignored, as are
#   edits that don't change the base (a title or description edit): they can't change the result.
name: pocp
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]   # edited: a retarget changes the base that judges it
permissions:
  contents: read
  actions: read          # --label-freshness: when this head first ran
  pull-requests: read    # --label-freshness: who applied each approval label, and when
jobs:
  verify:
    if: vars.POCP_STATUS_LIVE != 'true' || ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || startsWith(github.event.label.name, 'pocp-approve-')) && (github.event.action != 'edited' || github.event.changes.base)
    # One run per pull request state: a newer push or approval cancels the older run. An
    # ignored label event gets a group of its own, so it can't cancel or replace a real run.
    # Every run joins the group when its event arrives, approvals included (the prediction below
    # is a step of this job, not a job before it), so the newest event's run is the one left.
    concurrency:
      group: ${{ (vars.POCP_STATUS_LIVE != 'true' || ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || startsWith(github.event.label.name, 'pocp-approve-')) && (github.event.action != 'edited' || github.event.changes.base)) && format('pocp-verify-{0}', github.event.pull_request.number) || format('pocp-ignored-{0}', github.run_id) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # A verify re-runs the checks once, at the head (about 5 minutes for this repo's test suite).
    timeout-minutes: 40
    env:
      APPROVE_POLICY: ${{ contains(github.event.pull_request.labels.*.name, 'pocp-approve-policy') && github.event.pull_request.head.sha || 'false' }}
      APPROVE_TESTS: ${{ contains(github.event.pull_request.labels.*.name, 'pocp-approve-tests') && github.event.pull_request.head.sha || 'false' }}
      APPROVE_COVERAGE: ${{ contains(github.event.pull_request.labels.*.name, 'pocp-approve-coverage') && github.event.pull_request.head.sha || 'false' }}
      APPROVE_INCONCLUSIVE: ${{ contains(github.event.pull_request.labels.*.name, 'pocp-approve-inconclusive') && github.event.pull_request.head.sha || 'false' }}
      WAIT_EXIT: ${{ vars.POCP_STATUS_LIVE == 'true' && '0' || '1' }}
    steps:
      # Which pull request and base this run evaluated. A head commit can belong to several pull
      # requests, each judged by its own base, so the reporter counts a run only for the pull
      # request and base this step names.
      - name: pocp-run pr-${{ github.event.pull_request.number }} base-${{ github.event.pull_request.base.sha }}
        run: 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # On a pocp-approve-* label (with POCP_STATUS_LIVE): does verify need to run at all? Not
      # when the reporter would now turn the status green from the run already waiting for these
      # approvals, or when the pull request has moved past this head. Asked with the reporter's
      # own code and config (the default branch, as pocp-status.yml checks it out), before any
      # of the pull request's code is checked out. A prediction only: it decides whether verify
      # runs; the reporter decides the status. An older reporter without the flag fails here,
      # and verify runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: vars.POCP_STATUS_LIVE == 'true' && github.event.action == 'labeled' && startsWith(github.event.label.name, 'pocp-approve-')
        continue-on-error: true    # a failed checkout: predict fails too, and verify runs
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: reporter
          persist-credentials: false
      - id: predict
        if: vars.POCP_STATUS_LIVE == 'true' && github.event.action == 'labeled' && startsWith(github.event.label.name, 'pocp-approve-')
        continue-on-error: true
        working-directory: reporter
        run: node bin/pocp.js status-report --predict-approval
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Verify needn't run. The run says so, and the reporter sets it aside like a skipped run:
      # the run already waiting decides. Every step below is skipped.
      - name: approved-without-run
        if: steps.predict.outputs.skip == 'true'
        run: 'true'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.predict.outputs.skip != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.predict.outputs.skip != 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: verifier
          persist-credentials: false
      # Before any of the pull request's code runs: whether this verifier isolates the checks.
      # The approvable step below trusts verify's outputs only when it did.
      - id: plan
        if: steps.predict.outputs.skip != 'true'
        working-directory: verifier
        run: |
          if node bin/pocp.js help 2>&1 | grep -q -- '--isolate'; then echo "isolate=true" >> "$GITHUB_OUTPUT"; fi
      # This repo has no dependencies to install. (Anything installed here, before verify, would
      # run the pull request's install scripts as this job's user: use verify --install instead.)
      # An approval is passed only to a verifier that supports it. With the label on and a
      # verifier that doesn't, the step fails and says so: an approval is never dropped.
      # The step exits with verify's exit code, so its outcome is verify's result; it keeps going
      # (continue-on-error) so the steps below can report a wait. It also records the code as an
      # output, which only picks waiting / inconclusive / failed, never green. (`run` comes first
      # so tools that find POCP's step by its `- run:` line, such as the tamper bench, still do.)
      - run: |
          set -- --rerun --require-coverage --accept-policy-change="$APPROVE_POLICY" --accept-test-change="$APPROVE_TESTS"
          if [ "$APPROVE_COVERAGE" != "false" ]; then
            if node ../verifier/bin/pocp.js help 2>&1 | grep -q -- '--accept-uncovered'; then
              set -- "$@" --accept-uncovered="$APPROVE_COVERAGE"
            else
              echo "::error title=POCP approval::pocp-approve-coverage is set, but the base branch's verifier does not support --accept-uncovered, so it cannot be applied. It takes effect once that support is on the base branch."
              exit 1
            fi
          fi
          if [ "${APPROVE_INCONCLUSIVE:-false}" != "false" ]; then
            if node ../verifier/bin/pocp.js help 2>&1 | grep -q -- '--accept-inconclusive'; then
              set -- "$@" --accept-inconclusive="$APPROVE_INCONCLUSIVE"
            else
              echo "::error title=POCP approval::pocp-approve-inconclusive is set, but the base branch's verifier does not support --accept-inconclusive, so it cannot be applied."
              exit 1
            fi
          fi
          if node ../verifier/bin/pocp.js help 2>&1 | grep -q -- '--exit-detail'; then set -- "$@" --exit-detail; fi
          # The token is for a verifier that checks label freshness; one that can't never holds it.
          if node ../verifier/bin/pocp.js help 2>&1 | grep -q -- '--label-freshness'; then
            set -- "$@" --label-freshness=github --repo="$GITHUB_REPOSITORY" --pull-request="$PR_NUMBER"
          else
            unset POCP_GITHUB_TOKEN
          fi
          # Isolated checks (see the top of this file). This repo has no dependencies to install;
          # a project with some passes --install "<command>" too, so its install runs isolated.
          rm -f "$APPROVAL_FILE"
          rm -f "$RECORD_FILE"
          if [ "$PLAN_ISOLATE" = "true" ]; then
            set -- "$@" --isolate
            if node ../verifier/bin/pocp.js help verify 2>&1 | grep -q -- '--approval-file'; then set -- "$@" --approval-file="$APPROVAL_FILE"; fi
            if node ../verifier/bin/pocp.js help verify 2>&1 | grep -q -- '--record-file'; then set -- "$@" --record-file="$RECORD_FILE"; fi
          else
            echo "::warning title=POCP isolation::the base branch's verifier predates --isolate, so this run's checks ran as the job's own user (not the secure profile)"
          fi
          set +e
          node ../verifier/bin/pocp.js verify "$RANGE" "$@"
          code=$?
          set -e
          echo "code=$code" >> "${GITHUB_OUTPUT:-/dev/null}"
          exit "$code"
        if: steps.predict.outputs.skip != 'true'
        name: verify
        id: verify
        continue-on-error: true
        working-directory: pr
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          POCP_GITHUB_TOKEN: ${{ github.token }}
          PLAN_ISOLATE: ${{ steps.plan.outputs.isolate }}
          APPROVAL_FILE: ${{ runner.temp }}/pocp-approvable
          RECORD_FILE: ${{ runner.temp }}/pocp-records
      # Which approvals verify was given (the reporter re-checks each label is still on).
      - name: approval-tests
        if: steps.predict.outputs.skip != 'true' && (env.APPROVE_TESTS != 'false')
        run: 'true'
      - name: approval-policy
        if: steps.predict.outputs.skip != 'true' && (env.APPROVE_POLICY != 'false')
        run: 'true'
      - name: approval-inconclusive
        if: steps.predict.outputs.skip != 'true' && (env.APPROVE_INCONCLUSIVE != 'false')
        run: 'true'
      - name: approval-coverage
        if: steps.predict.outputs.skip != 'true' && (env.APPROVE_COVERAGE != 'false')
        run: 'true'
      # What verify's approval file says (written by verify only when the checks ran isolated
      # and the wait is for approvals only). This step prints nothing of the pull request's, so
      # nothing printed during verify can set its outputs.
      - id: mark
        if: steps.predict.outputs.skip != 'true' && (steps.plan.outputs.isolate == 'true')
        run: |
          if [ -f "$APPROVAL_FILE" ]; then
            labels=$(head -n 1 "$APPROVAL_FILE")
            if printf '%s' "$labels" | grep -Eqx 'pocp-approve-[a-z]+(,pocp-approve-[a-z]+)*'; then
              { echo "approvable=true"; echo "needs=$labels"; } >> "$GITHUB_OUTPUT"
              # The test guard's verdict, one of four fixed words (an older verify writes none).
              verdict=$(grep -Ex 'verdict=(behavior-changed|detection-dropped|baseline-red|needs-review)' "$APPROVAL_FILE" | head -n 1 | cut -d= -f2 || true)
              if [ -n "$verdict" ]; then echo "verdict=$verdict" >> "$GITHUB_OUTPUT"; fi
            fi
          fi
        env:
          APPROVAL_FILE: ${{ runner.temp }}/pocp-approvable
      # Which labels verify waits for, so the pocp status can name them all, with one command to
      # add them. From the approval file when there is one (then they also decide the result,
      # with the approvable step below); otherwise from verify's `needs` output, text only.
      - name: needs-tests
        if: steps.predict.outputs.skip != 'true' && (contains(steps.mark.outputs.approvable == 'true' && steps.mark.outputs.needs || steps.verify.outputs.needs, 'pocp-approve-tests'))
        run: 'true'
      - name: needs-policy
        if: steps.predict.outputs.skip != 'true' && (contains(steps.mark.outputs.approvable == 'true' && steps.mark.outputs.needs || steps.verify.outputs.needs, 'pocp-approve-policy'))
        run: 'true'
      - name: needs-inconclusive
        if: steps.predict.outputs.skip != 'true' && (contains(steps.mark.outputs.approvable == 'true' && steps.mark.outputs.needs || steps.verify.outputs.needs, 'pocp-approve-inconclusive'))
        run: 'true'
      # The wait is for the approvals above only, and they are all listed: the reporter turns it
      # green once each is given, without running verify again. From the approval file, so only
      # when the checks were isolated (decided by `plan` before any of the pull request's code ran).
      - name: approvable
        if: steps.predict.outputs.skip != 'true' && (steps.mark.outputs.approvable == 'true')
        run: 'true'
      # What the test guard found, for the words on the pocp status and the reporter's comment
      # (never the result): from the same file, so only with the approvable step above.
      - name: verdict-behavior-changed
        if: steps.predict.outputs.skip != 'true' && (steps.mark.outputs.approvable == 'true' && steps.mark.outputs.verdict == 'behavior-changed')
        run: 'true'
      - name: verdict-detection-dropped
        if: steps.predict.outputs.skip != 'true' && (steps.mark.outputs.approvable == 'true' && steps.mark.outputs.verdict == 'detection-dropped')
        run: 'true'
      - name: verdict-baseline-red
        if: steps.predict.outputs.skip != 'true' && (steps.mark.outputs.approvable == 'true' && steps.mark.outputs.verdict == 'baseline-red')
        run: 'true'
      - name: verdict-needs-review
        if: steps.predict.outputs.skip != 'true' && (steps.mark.outputs.approvable == 'true' && steps.mark.outputs.verdict == 'needs-review')
        run: 'true'
      # What an approval of this head binds to (src/sticky-approval.js): the files it holds as
      # test changes, and, for a sticky label given for an earlier head, whether this head is
      # exactly that head plus base content. From verify's record file (written only when the
      # checks ran isolated, which can't reach it), read by a step that prints nothing of the pull
      # request's, each line checked against a fixed pattern. The reporter reads them back from
      # the step names below, from a head that changes no CI file.
      - id: records
        if: steps.predict.outputs.skip != 'true' && (steps.plan.outputs.isolate == 'true')
        run: |
          [ -f "$RECORD_FILE" ] || exit 0
          while IFS= read -r line; do
            if printf '%s' "$line" | grep -Eqx 'held tests [0-9a-f]{64}'; then
              echo "held_tests=${line#held tests }" >> "$GITHUB_OUTPUT"
            elif printf '%s' "$line" | grep -Eqx 'approval pocp-approve-(tests|policy) (same|content|conflict|ci|policy|gone) [0-9a-f]{40}'; then
              rest=${line#approval pocp-approve-}
              echo "approval_${rest%% *}=${rest#* }" >> "$GITHUB_OUTPUT"
            fi
          done < "$RECORD_FILE"
        env:
          RECORD_FILE: ${{ runner.temp }}/pocp-records
      - name: pocp-held tests ${{ steps.records.outputs.held_tests }}
        if: steps.predict.outputs.skip != 'true' && (steps.records.outputs.held_tests != '')
        run: 'true'
      - name: pocp-approval pocp-approve-tests ${{ steps.records.outputs.approval_tests }}
        if: steps.predict.outputs.skip != 'true' && (steps.records.outputs.approval_tests != '')
        run: 'true'
      - name: pocp-approval pocp-approve-policy ${{ steps.records.outputs.approval_policy }}
        if: steps.predict.outputs.skip != 'true' && (steps.records.outputs.approval_policy != '')
        run: 'true'
      # Exactly one of verified / waiting / inconclusive / failed runs. "verified" needs the
      # verify step's own exit status; the code output can only turn a result into a wait
      # (yellow) or a failure (red). Only "failed" means red once POCP_STATUS_LIVE is on; a
      # missing or unknown code is a failure.
      - name: verified
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outcome == 'success' && steps.verify.outputs.code == '0')
        run: 'true'
      - name: waiting
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outputs.code == '4')
        run: |
          echo "::notice title=POCP::waiting for a maintainer's approval (see the summary above)"
          exit "$WAIT_EXIT"
      - name: inconclusive
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outputs.code == '5')
        run: |
          echo "::notice title=POCP::a check didn't finish: re-run this job, or a maintainer approves with pocp-approve-inconclusive"
          exit "$WAIT_EXIT"
      - name: failed
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outputs.code != '4' && steps.verify.outputs.code != '5' && (steps.verify.outcome != 'success' || steps.verify.outputs.code != '0'))
        run: exit 1
