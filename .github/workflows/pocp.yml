# POCP verifying its own pull requests with the POCP from the base branch: a change to the
# verifier is judged by the verifier it would replace, never by its own code. The pull request
# is checked out in pr/ and the base commit in verifier/; only verifier/bin/pocp.js runs verify.
# (The pull request's code still runs in the re-runs, as in any project; see
# docs/THREAT-MODEL.md.) Approval labels count only on label events, for the head at that
# moment; pocp-labels.yml removes them on every push.
#
# The job's steps tell the trusted reporter (pocp-status.yml, docs/STATUS.md) what verify found:
# "verified" runs only when the verify step itself exited 0; otherwise exactly one of waiting /
# inconclusive / failed runs. An approval-* step runs for each approval passed to verify. The
# reporter trusts these steps only when the pull request changes no CI file.
#
# Green comes only from verify's exit status (the step's outcome), which the checks verify runs
# can't write. The step's `code` output can: they run as the same user as this job, and the file
# GitHub reads outputs from is on the same disk. So the code only chooses between waiting,
# inconclusive and failed; it never makes a run green.
#
# POCP_STATUS_LIVE (a repository variable, set by an admin; a pull request can't change it):
# - unset: waiting and inconclusive still fail the job, as before, because "verify" is the
#   required check. Every label event runs verify (a job skipped by a label filter would show
#   as a skipped check, and GitHub counts a skipped required check as passing).
# - 'true': the "pocp" status is the required check. Waiting and inconclusive pass the job
#   (no red, no failure email), and label events other than pocp-approve-* are ignored.
name: pocp
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]   # edited: a retarget changes the base that judges it
permissions:
  contents: read
jobs:
  verify:
    if: vars.POCP_STATUS_LIVE != 'true' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || startsWith(github.event.label.name, 'pocp-approve-')
    # One run per pull request state: a newer push or approval cancels the older run. An
    # ignored label event gets a group of its own, so it can't cancel or replace a real run.
    concurrency:
      group: ${{ (vars.POCP_STATUS_LIVE != 'true' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || startsWith(github.event.label.name, 'pocp-approve-')) && format('pocp-verify-{0}', github.event.pull_request.number) || format('pocp-ignored-{0}', github.run_id) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # A verify re-runs each commit's checks (about 4 minutes for this repo's test suite today).
    timeout-minutes: 40
    env:
      APPROVE_POLICY: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && contains(github.event.pull_request.labels.*.name, 'pocp-approve-policy') && github.event.pull_request.head.sha || 'false' }}
      APPROVE_TESTS: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && contains(github.event.pull_request.labels.*.name, 'pocp-approve-tests') && github.event.pull_request.head.sha || 'false' }}
      APPROVE_COVERAGE: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && contains(github.event.pull_request.labels.*.name, 'pocp-approve-coverage') && github.event.pull_request.head.sha || 'false' }}
      APPROVE_INCONCLUSIVE: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && contains(github.event.pull_request.labels.*.name, 'pocp-approve-inconclusive') && github.event.pull_request.head.sha || 'false' }}
      WAIT_EXIT: ${{ vars.POCP_STATUS_LIVE == 'true' && '0' || '1' }}
    steps:
      # Which pull request and base this run evaluated. A head commit can belong to several pull
      # requests, each judged by its own base, so the reporter counts a run only for the pull
      # request and base this step names.
      - name: pocp-run pr-${{ github.event.pull_request.number }} base-${{ github.event.pull_request.base.sha }}
        run: 'true'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: verifier
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # This repo has no dependencies to install.
      # An approval is passed only to a verifier that supports it. With the label on and a
      # verifier that doesn't, the step fails and says so: an approval is never dropped.
      # The step exits with verify's exit code, so its outcome is verify's result; it keeps going
      # (continue-on-error) so the steps below can report a wait. It also records the code as an
      # output, which only picks waiting / inconclusive / failed: a check that writes to the
      # output file can't make the run green. (`run` comes first so tools that find POCP's step
      # by its `- run:` line, such as the tamper bench, still do.)
      - run: |
          set -- --rerun --require-coverage --accept-policy-change="$APPROVE_POLICY" --accept-test-change="$APPROVE_TESTS"
          if [ "$APPROVE_COVERAGE" != "false" ]; then
            if node ../verifier/bin/pocp.js help 2>&1 | grep -q -- '--accept-uncovered'; then
              set -- "$@" --accept-uncovered="$APPROVE_COVERAGE"
            else
              echo "::error title=POCP approval::pocp-approve-coverage is set, but the base branch's verifier does not support --accept-uncovered, so it cannot be applied. It takes effect once that support is on the base branch."
              exit 1
            fi
          fi
          if [ "${APPROVE_INCONCLUSIVE:-false}" != "false" ]; then
            if node ../verifier/bin/pocp.js help 2>&1 | grep -q -- '--accept-inconclusive'; then
              set -- "$@" --accept-inconclusive="$APPROVE_INCONCLUSIVE"
            else
              echo "::error title=POCP approval::pocp-approve-inconclusive is set, but the base branch's verifier does not support --accept-inconclusive, so it cannot be applied."
              exit 1
            fi
          fi
          if node ../verifier/bin/pocp.js help 2>&1 | grep -q -- '--exit-detail'; then set -- "$@" --exit-detail; fi
          set +e
          node ../verifier/bin/pocp.js verify "$RANGE" "$@"
          code=$?
          set -e
          echo "code=$code" >> "${GITHUB_OUTPUT:-/dev/null}"
          exit "$code"
        name: verify
        id: verify
        continue-on-error: true
        working-directory: pr
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      # Which approvals verify was given (the reporter re-checks each label is still on).
      - name: approval-tests
        if: env.APPROVE_TESTS != 'false'
        run: 'true'
      - name: approval-policy
        if: env.APPROVE_POLICY != 'false'
        run: 'true'
      - name: approval-inconclusive
        if: env.APPROVE_INCONCLUSIVE != 'false'
        run: 'true'
      - name: approval-coverage
        if: env.APPROVE_COVERAGE != 'false'
        run: 'true'
      # Exactly one of verified / waiting / inconclusive / failed runs. "verified" needs the
      # verify step's own exit status; the code output can only turn a result into a wait
      # (yellow) or a failure (red). Only "failed" means red once POCP_STATUS_LIVE is on; a
      # missing or unknown code is a failure.
      - name: verified
        if: steps.verify.outcome == 'success' && steps.verify.outputs.code == '0'
        run: 'true'
      - name: waiting
        if: steps.verify.outputs.code == '4'
        run: |
          echo "::notice title=POCP::waiting for a maintainer's approval (see the summary above)"
          exit "$WAIT_EXIT"
      - name: inconclusive
        if: steps.verify.outputs.code == '5'
        run: |
          echo "::notice title=POCP::a check didn't finish: re-run this job, or a maintainer approves with pocp-approve-inconclusive"
          exit "$WAIT_EXIT"
      - name: failed
        if: steps.verify.outputs.code != '4' && steps.verify.outputs.code != '5' && (steps.verify.outcome != 'success' || steps.verify.outputs.code != '0')
        run: exit 1
