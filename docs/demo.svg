<svg xmlns="http://www.w3.org/2000/svg" width="749" height="532" viewBox="0 0 749 532" role="img" aria-label="Demo: an agent breaks add(), edits the test until it passes, plain tests go green, and pocp verify reports that the old test fails on the new code">
<title>POCP demo: an edited test passes, the old test fails on the new code</title>
<rect width="749" height="532" rx="10" fill="#0d1117"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve">
<text x="20" y="52" fill="#8b949e" font-style="italic" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0000;0.0000;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/># An agent rewrites add() and breaks it for negative numbers.</text>
<clipPath id="c1"><rect x="20" y="57" height="21" width="0"><animate attributeName="width" values="0;0;88.3;88.3" keyTimes="0;0.0218;0.0364;1" dur="27.5s" repeatCount="indefinite"/></rect></clipPath><text x="20" y="73" clip-path="url(#c1)"><tspan fill="#7ee787" font-weight="bold">$</tspan><tspan fill="#e6edf3"> npm test</tspan></text>
<text x="20" y="94" fill="#ff7b72" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0484;0.0484;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/>✗ 1 test failed: 2 !== 0</text>
<text x="20" y="115" fill="#8b949e" font-style="italic" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0993;0.0993;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/># The test fails. So the agent edits the test until it passes:</text>
<clipPath id="c4"><rect x="20" y="120" height="21" width="0"><animate attributeName="width" values="0;0;138.9;138.9" keyTimes="0;0.1211;0.1433;1" dur="27.5s" repeatCount="indefinite"/></rect></clipPath><text x="20" y="136" clip-path="url(#c4)"><tspan fill="#7ee787" font-weight="bold">$</tspan><tspan fill="#e6edf3"> git diff test/</tspan></text>
<text x="20" y="157" fill="#ffa198" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1553;0.1553;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/>-  assert.equal(add(-1, 1), 0);</text>
<text x="20" y="178" fill="#aff5b4" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1553;0.1553;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/>+  assert.equal(add(-1, 1), 2);</text>
<clipPath id="c7"><rect x="20" y="183" height="21" width="0"><animate attributeName="width" values="0;0;88.3;88.3" keyTimes="0;0.2062;0.2207;1" dur="27.5s" repeatCount="indefinite"/></rect></clipPath><text x="20" y="199" clip-path="url(#c7)"><tspan fill="#7ee787" font-weight="bold">$</tspan><tspan fill="#e6edf3"> npm test</tspan></text>
<text x="20" y="220" fill="#7ee787" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2327;0.2327;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/>✓ 1 test passed</text>
<text x="20" y="241" fill="#8b949e" font-style="italic" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2836;0.2836;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/># Plain CI runs the current tests on the current code: green.</text>
<text x="20" y="262" fill="#8b949e" font-style="italic" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3127;0.3127;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/># POCP blocks the commit until the change has evidence. The agent runs pocp fix:</text>
<clipPath id="c11"><rect x="20" y="267" height="21" width="0"><animate attributeName="width" values="0;0;417.1;417.1" keyTimes="0;0.3345;0.3985;1" dur="27.5s" repeatCount="indefinite"/></rect></clipPath><text x="20" y="283" clip-path="url(#c11)"><tspan fill="#7ee787" font-weight="bold">$</tspan><tspan fill="#e6edf3"> git add -A &amp;&amp; pocp fix --intent "Rewrite add()"</tspan></text>
<text x="20" y="304" fill="#e6edf3" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4109;0.4109;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/>pocp fix: committable now; CI requires human approval of the test change</text>
<clipPath id="c13"><rect x="20" y="309" height="21" width="0"><animate attributeName="width" values="0;0;273.8;273.8" keyTimes="0;0.4618;0.5040;1" dur="27.5s" repeatCount="indefinite"/></rect></clipPath><text x="20" y="325" clip-path="url(#c13)"><tspan fill="#7ee787" font-weight="bold">$</tspan><tspan fill="#e6edf3"> git commit -qm "Rewrite add()"</tspan></text>
<text x="20" y="346" fill="#8b949e" font-style="italic" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5382;0.5382;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/># In CI, POCP re-runs the checks, and runs the OLD test on the NEW code:</text>
<clipPath id="c15"><rect x="20" y="351" height="21" width="0"><animate attributeName="width" values="0;0;273.8;273.8" keyTimes="0;0.5600;0.6022;1" dur="27.5s" repeatCount="indefinite"/></rect></clipPath><text x="20" y="367" clip-path="url(#c15)"><tspan fill="#7ee787" font-weight="bold">$</tspan><tspan fill="#e6edf3"> pocp verify main..HEAD --rerun</tspan></text>
<text x="20" y="388" fill="#ff7b72" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6145;0.6145;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/>NOT verified: 1 commit(s) in main..HEAD · 2106ms</text>
<text x="20" y="409" fill="#7ee787" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7018;0.7018;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/>  rerun passed   npm test --silent   &lt;- the edited test passes</text>
<text x="20" y="430" fill="#ff7b72" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7018;0.7018;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/>  BAD: the old tests fail on the new code ("npm test --silent" exit 1)</text>
<text x="20" y="451" fill="#ff7b72" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7018;0.7018;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/>       behavior changed, so a person must approve it</text>
<text x="20" y="472" fill="#e3b341" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7018;0.7018;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/>  next: a maintainer reviews the test change and adds the `pocp-approve-tests` label</text>
<text x="20" y="493" fill="#8b949e" font-style="italic" opacity="0" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8182;0.8182;1" dur="27.5s" repeatCount="indefinite" calcMode="discrete"/># Merging waits for a maintainer. Exit code 1.</text>
</g>
</svg>
