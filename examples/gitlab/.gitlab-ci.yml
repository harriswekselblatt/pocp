# POCP on GitLab CI. Make the "pocp" job required for merging with
# Settings → Merge requests → "Pipelines must succeed".
#
# verify judges the merge request by the target branch's rules and re-runs every required
# check itself (--rerun), each in a fresh copy of the commit with no .git. Nothing from the
# merge request runs before it starts. The re-runs are the merge request's code, running in
# this job as the same user: see docs/THREAT-MODEL.md for what that does and doesn't allow.
pocp:
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0                      # verify reads the whole range of commits
    POCP_REF: "v1.1.1"                # the POCP release (or commit) you run, pinned
  script:
    # ▶ Install your toolchain and dependencies (without running install scripts where you can).
    - >
      npx --yes "github:harriswekselblatt/pocp#${POCP_REF}" verify --rerun --require-coverage
      "$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA"
      --accept-policy-change="${POCP_ACCEPT_POLICY:-false}" --accept-test-change="${POCP_ACCEPT_TESTS:-false}"
# Approvals: after reviewing a change that loosens rules or edits existing tests, a maintainer
# runs a new pipeline for the merge request (Build → Pipelines → Run pipeline, on the source
# branch) with POCP_ACCEPT_POLICY or POCP_ACCEPT_TESTS set to the head commit's sha they
# reviewed. A sha approves only that head: a later push needs a new approval. Restrict who can
# set pipeline variables to maintainers (Settings → CI/CD → Variables → "Minimum role to use
# pipeline variables"). Don't use a project-level CI/CD variable: it would apply to every
# merge request.
#
# Faster, but trusting: wrap your test step in `pocp ci-run --results ci-results.jsonl -- <cmd>`
# before verify and add `--ci-results ci-results.jsonl`. Anything that runs earlier in the job,
# such as a new test file, can then write a passing result for any check.
