# .github/workflows/pocp-status.yml
# The trusted reporter (docs/STATUS.md): sets the "pocp" commit status on each pull request's
# head, green / yellow / red, from what the verify job in pocp.yml found.
#
# It runs with a token that can write statuses, also for pull requests from forks, so it never
# checks out, downloads or runs anything from a pull request. It checks out only your default
# branch (for .proof/config.json) and runs POCP's reporter action, pinned like the verify action.
# A run's results count only when the pull request changes no CI file: a pull request runs its
# own copy of pocp.yml, so if it edits that, the status stays yellow until a maintainer approves
# the workflow change with pocp-approve-workflow.
#
# workflow_run: when a pocp run finishes. pull_request_target: when the head or the labels change.
name: pocp-status
on:
  workflow_run:
    workflows: [pocp]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]   # edited: a retarget changes the base that judges it
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write
jobs:
  report:
    # Skipped (no Actions minutes) for events that can't change the status: a label other than
    # pocp-approve-*, or an edit that doesn't change the base. Pushes, retargets, approval labels
    # and finished verify runs always report.
    if: github.event_name != 'pull_request_target' || ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || startsWith(github.event.label.name, 'pocp-approve-')) && (github.event.action != 'edited' || github.event.changes.base)
    # One at a time per head, none cancelled: each recomputes from scratch, so the last one wins.
    concurrency:
      group: pocp-status-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false   # no cache restore in a job that can write statuses
      - uses: harriswekselblatt/pocp/status@POCP_REF               # the same pin as the verify action
        with:
          workflow: .github/workflows/pocp.yml
