# .github/workflows/pocp.yml
# POCP on GitHub Actions, for a project in any language. `pocp init --github` writes this file,
# pocp-status.yml and pocp-labels.yml, pinned to your POCP version. docs/STATUS.md explains the
# "pocp" status these produce; docs/QUICKSTART.md, how to turn it on.
#
# verify judges the pull request by the base branch's rules and re-runs every required check
# itself, each in a fresh copy of the commit. The job reports what it found through which steps
# run: exactly one of verified / waiting / inconclusive / failed, plus an approval-* step for
# each approval passed to verify. "verified" runs only when the verify step itself succeeded:
# its exit status is the one result the checks it runs can't write. Its `code` output only
# picks between waiting, inconclusive and failed. pocp-status.yml, a separate trusted workflow, reads
# those steps and sets the "pocp" commit status: green, yellow (waiting for a maintainer, or a
# check didn't finish) or red.
#
# The pull request's code runs in this job: verify re-runs its checks. With `isolate: true` (the
# default), each check, and the `install` command, runs as a fresh unprivileged Linux user made
# for that one run. It can't write the action's files or this checkout (its .proof run records
# included), can't read or write RUNNER_TEMP or $HOME, never sees a token, can't signal verify,
# and everything it starts is killed when it ends. If that can't be set up, verify fails rather
# than run checks as the job's user. docs/THREAT-MODEL.md says exactly what is and isn't covered.
#
# POCP_STATUS_LIVE (a repository variable an admin sets; a pull request can't change it):
# - unset (start here): waits still fail this job, so "verify" can stay your required check
#   while you watch the "pocp" status on a few pull requests. Every label event runs verify.
# - 'true': require the "pocp" status instead of "verify" (see docs/STATUS.md). Waits pass this
#   job, so there's no red ✗ and no failure email, and label events other than pocp-approve-*
#   are ignored. Switch the variable and the required check together: a skipped required check
#   counts as passing, so don't filter labels while "verify" is required.
name: pocp
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]   # edited: a retarget changes the base that judges it
permissions:
  contents: read
jobs:
  verify:
    if: vars.POCP_STATUS_LIVE != 'true' || ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || startsWith(github.event.label.name, 'pocp-approve-')) && (github.event.action != 'edited' || github.event.changes.base)
    # One run per pull request state: a newer push or approval cancels the older run. An ignored
    # label event gets a group of its own, so it can't cancel or replace a real run.
    concurrency:
      group: ${{ (vars.POCP_STATUS_LIVE != 'true' || ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || startsWith(github.event.label.name, 'pocp-approve-')) && (github.event.action != 'edited' || github.event.changes.base)) && format('pocp-verify-{0}', github.event.pull_request.number) || format('pocp-ignored-{0}', github.run_id) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # verify re-runs every required check of every commit: allow for your test suite times the
    # number of commits in a typical pull request, with margin.
    timeout-minutes: 60
    env:
      # Each approval is a label only maintainers apply. A label isn't tied to a commit, so it
      # counts only on the event that changed labels, and only for the head at that moment (the
      # sha is passed, so verify checks it). pocp-labels.yml removes every approval on each push.
      APPROVE_POLICY: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled' || (vars.POCP_STATUS_LIVE == 'true' && github.event.action == 'synchronize')) && contains(github.event.pull_request.labels.*.name, 'pocp-approve-policy') && github.event.pull_request.head.sha || 'false' }}
      APPROVE_TESTS: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled' || (vars.POCP_STATUS_LIVE == 'true' && github.event.action == 'synchronize')) && contains(github.event.pull_request.labels.*.name, 'pocp-approve-tests') && github.event.pull_request.head.sha || 'false' }}
      APPROVE_INCONCLUSIVE: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && contains(github.event.pull_request.labels.*.name, 'pocp-approve-inconclusive') && github.event.pull_request.head.sha || 'false' }}
      APPROVE_COVERAGE: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled' || (vars.POCP_STATUS_LIVE == 'true' && github.event.action == 'synchronize')) && contains(github.event.pull_request.labels.*.name, 'pocp-approve-coverage') && github.event.pull_request.head.sha || 'false' }}
      WAIT_EXIT: ${{ vars.POCP_STATUS_LIVE == 'true' && '0' || '1' }}
    steps:
      # Which pull request and base this run evaluated. A head commit can belong to several pull
      # requests, each judged by its own base, so pocp-status.yml counts a run only for the pull
      # request and base this step names. Keep it first, and keep its name exactly.
      - name: pocp-run pr-${{ github.event.pull_request.number }} base-${{ github.event.pull_request.base.sha }}
        run: 'true'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # the PR head, not GitHub's merge commit
          fetch-depth: 0                                    # verify reads the whole range of commits
          persist-credentials: false                        # no token left in .git/config for the PR's code
      # ▶ Your toolchain (examples: actions/setup-node, actions/setup-python, actions/setup-go).
      #   Isolated checks can't read $HOME, so the toolchain must live outside it (the setup-*
      #   actions install to the runner's tool cache, which is fine).
      # ▶ Don't install dependencies in a step here: that runs the PR's install scripts as this
      #   job's user. Give the command to verify's `install` input instead (below).
      - uses: harriswekselblatt/pocp@POCP_REF                  # pin a release or commit; the action runs its bundled pocp
        name: verify
        id: verify
        continue-on-error: true    # the step fails unless verified; the steps below report why
        with:
          rerun: all
          isolate: true              # each check runs as a fresh unprivileged user (Linux runners)
          # install: npm ci          # ▶ your install command: runs isolated, before the checks
          exit-detail: true
          accept-policy-change: ${{ env.APPROVE_POLICY }}
          accept-test-change: ${{ env.APPROVE_TESTS }}
          accept-inconclusive: ${{ env.APPROVE_INCONCLUSIVE }}
          accept-uncovered: ${{ env.APPROVE_COVERAGE }}
      # Which approvals verify was given (the reporter re-checks each label is still on).
      - name: approval-tests
        if: env.APPROVE_TESTS != 'false'
        run: 'true'
      - name: approval-policy
        if: env.APPROVE_POLICY != 'false'
        run: 'true'
      - name: approval-inconclusive
        if: env.APPROVE_INCONCLUSIVE != 'false'
        run: 'true'
      - name: approval-coverage
        if: env.APPROVE_COVERAGE != 'false'
        run: 'true'
      # Exactly one of these runs. Green needs the verify step's own success; the code output
      # only picks waiting / inconclusive / failed. A missing or unknown code is a failure.
      - name: verified
        if: steps.verify.outcome == 'success' && steps.verify.outputs.code == '0'
        run: 'true'
      - name: waiting
        if: steps.verify.outputs.code == '4'
        run: |
          echo "::notice title=POCP::waiting for a maintainer's approval (see the summary above)"
          exit "$WAIT_EXIT"
      - name: inconclusive
        if: steps.verify.outputs.code == '5'
        run: |
          echo "::notice title=POCP::a check didn't finish: re-run this job, or a maintainer approves with pocp-approve-inconclusive"
          exit "$WAIT_EXIT"
      - name: failed
        if: steps.verify.outputs.code != '4' && steps.verify.outputs.code != '5' && (steps.verify.outcome != 'success' || steps.verify.outputs.code != '0')
        run: exit 1
#
# Faster, but trusting: run your tests through `pocp ci-run --results ci-results.jsonl -- <cmd>`
# in this job before verify, and pass `ci-results: ci-results.jsonl`. The tests then run once
# instead of twice. Use it only if you accept that anything that runs earlier in the job can
# write that file.
#
# Which findings fail and which CI results are required come from .proof/config.json
# ("verify.fail_on", "verify.require_ci"), not from this file.
#
# Pull requests from forks run the repo's own commands. Treat this job like your test job for
# outside contributors: no secrets, read-only permissions.
