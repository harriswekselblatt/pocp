# .github/workflows/pocp.yml
# POCP on GitHub Actions, for a project in any language. `pocp init --github` writes this file,
# and pocp-status.yml, pinned to your POCP version. docs/STATUS.md explains the
# "pocp" status these produce; docs/QUICKSTART.md, how to turn it on.
#
# verify judges the pull request by the base branch's rules and re-runs every required check
# itself, each in a fresh copy of the commit. The job reports what it found through which steps
# run: exactly one of verified / waiting / inconclusive / failed, plus an approval-* step for
# each approval passed to verify. "verified" runs only when the verify step itself succeeded:
# its exit status is the one result the checks it runs can't write. Its `code` output only
# picks between waiting, inconclusive and failed. pocp-status.yml, a separate trusted workflow, reads
# those steps and sets the "pocp" commit status: green, yellow (waiting for a maintainer, or a
# check didn't finish) or red.
#
# The pull request's code runs in this job: verify re-runs its checks. With `isolate: true` (the
# default), each check, and the `install` command, runs as a fresh unprivileged Linux user made
# for that one run. It can't write the action's files or this checkout (its .proof run records
# included), can't read or write RUNNER_TEMP or $HOME, never sees a token, can't signal verify,
# and everything it starts is killed when it ends. If that can't be set up, verify fails rather
# than run checks as the job's user. docs/THREAT-MODEL.md says exactly what is and isn't covered.
#
# POCP_STATUS_LIVE (a repository variable an admin sets; a pull request can't change it):
# - unset (start here): waits still fail this job, so "verify" can stay your required check
#   while you watch the "pocp" status on a few pull requests. Every label event runs verify.
# - 'true': require the "pocp" status instead of "verify" (see docs/STATUS.md). Waits pass this
#   job, so there's no red ✗ and no failure email, and label events other than pocp-approve-*
#   are ignored. Switch the variable and the required check together: a skipped required check
#   counts as passing, so don't filter labels while "verify" is required.
#
# Approving without a second run (POCP_STATUS_LIVE 'true'): when verify waits only for
# pocp-approve-tests and its checks were isolated, the action says so (its `approvable` output)
# and the `approvable` step runs. Once the label is given by a writer, the trusted reporter
# turns the status green from that run. On the label event, the first steps ask whether that is
# now the case (the status action's predict-approval); if so, the rest of the job is skipped,
# since it would decide nothing new. If not, or on any doubt, verify runs as before.
name: pocp
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]   # edited: a retarget changes the base that judges it
permissions:
  contents: read
  actions: read          # label-freshness: when this head first ran
  pull-requests: read    # label-freshness: who applied each approval label, and when
jobs:
  verify:
    if: vars.POCP_STATUS_LIVE != 'true' || ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || startsWith(github.event.label.name, 'pocp-approve-')) && (github.event.action != 'edited' || github.event.changes.base)
    # One run per pull request state: a newer push or approval cancels the older run. An ignored
    # label event gets a group of its own, so it can't cancel or replace a real run. Every run
    # joins the group when its event arrives, approvals included (the prediction below is a step
    # of this job), so the newest event's run is the one left.
    concurrency:
      group: ${{ (vars.POCP_STATUS_LIVE != 'true' || ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || startsWith(github.event.label.name, 'pocp-approve-')) && (github.event.action != 'edited' || github.event.changes.base)) && format('pocp-verify-{0}', github.event.pull_request.number) || format('pocp-ignored-{0}', github.run_id) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # verify re-runs every required check once, at the head, plus the test guard when tests
    # change: allow for a few runs of your test suite, with margin.
    timeout-minutes: 60
    env:
      # Each approval is a label only maintainers apply. A label isn't tied to a commit, so the
      # head's sha is passed with it and verify (label-freshness, below) asks GitHub whether the
      # label was applied by a writer after this head first ran: a label left on from before a
      # push doesn't count, except through "Update branch" (a clean merge of the base).
      APPROVE_POLICY: ${{ contains(github.event.pull_request.labels.*.name, 'pocp-approve-policy') && github.event.pull_request.head.sha || 'false' }}
      APPROVE_TESTS: ${{ contains(github.event.pull_request.labels.*.name, 'pocp-approve-tests') && github.event.pull_request.head.sha || 'false' }}
      APPROVE_INCONCLUSIVE: ${{ contains(github.event.pull_request.labels.*.name, 'pocp-approve-inconclusive') && github.event.pull_request.head.sha || 'false' }}
      APPROVE_COVERAGE: ${{ contains(github.event.pull_request.labels.*.name, 'pocp-approve-coverage') && github.event.pull_request.head.sha || 'false' }}
      WAIT_EXIT: ${{ vars.POCP_STATUS_LIVE == 'true' && '0' || '1' }}
    steps:
      # Which pull request and base this run evaluated. A head commit can belong to several pull
      # requests, each judged by its own base, so pocp-status.yml counts a run only for the pull
      # request and base this step names. Keep it first, and keep its name exactly.
      - name: pocp-run pr-${{ github.event.pull_request.number }} base-${{ github.event.pull_request.base.sha }}
        run: 'true'
      # On a pocp-approve-* label (with POCP_STATUS_LIVE): does verify need to run at all? Not
      # when the reporter would now turn the status green from the run already waiting for this
      # approval, or when the pull request has moved past this head. Asked before the pull
      # request is checked out, with the default branch's .proof/config.json (as the reporter
      # reads it) and the status action at the same ref as in pocp-status.yml (checked: if they
      # differ, verify runs). A prediction only: the reporter decides the status.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: vars.POCP_STATUS_LIVE == 'true' && github.event.action == 'labeled' && startsWith(github.event.label.name, 'pocp-approve-')
        continue-on-error: true    # a failed checkout: predict finds no config, and verify runs
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .proof
          path: .pocp-reporter
          persist-credentials: false
      - uses: harriswekselblatt/pocp/status@POCP_REF          # the same ref as pocp-status.yml
        id: predict
        if: vars.POCP_STATUS_LIVE == 'true' && github.event.action == 'labeled' && startsWith(github.event.label.name, 'pocp-approve-')
        continue-on-error: true    # any doubt: verify runs
        with:
          predict-approval: 'true'
          config-dir: .pocp-reporter
          labels-token: ''
      # Verify needn't run. The run says so, and the reporter sets it aside like a skipped run:
      # the run already waiting decides. Every step below is skipped.
      - name: approved-without-run
        if: steps.predict.outputs.skip == 'true'
        run: 'true'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.predict.outputs.skip != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # the PR head, not GitHub's merge commit
          fetch-depth: 0                                    # verify reads the whole range of commits
          persist-credentials: false                        # no token left in .git/config for the PR's code
      # ▶ Your toolchain (examples: actions/setup-node, actions/setup-python, actions/setup-go).
      #   Isolated checks can't read $HOME, so the toolchain must live outside it (the setup-*
      #   actions install to the runner's tool cache, which is fine).
      # ▶ Don't install dependencies in a step here: that runs the PR's install scripts as this
      #   job's user. Give the command to verify's `install` input instead (below).
      - uses: harriswekselblatt/pocp@POCP_REF                  # pin a release or commit; the action runs its bundled pocp
        if: steps.predict.outputs.skip != 'true'
        name: verify
        id: verify
        continue-on-error: true    # the step fails unless verified; the steps below report why
        with:
          label-freshness: github  # an approval's label must be given after this head first ran
          github-token: ${{ github.token }}   # read-only (permissions above); verify's process only
          rerun: all
          isolate: true              # each check runs as a fresh unprivileged user (Linux runners)
          # install: npm ci          # ▶ your install command: runs isolated, before the checks
          exit-detail: true
          accept-policy-change: ${{ env.APPROVE_POLICY }}
          accept-test-change: ${{ env.APPROVE_TESTS }}
          accept-inconclusive: ${{ env.APPROVE_INCONCLUSIVE }}
          accept-uncovered: ${{ env.APPROVE_COVERAGE }}
      # Which approvals verify was given (the reporter re-checks each label is still on).
      - name: approval-tests
        if: steps.predict.outputs.skip != 'true' && (env.APPROVE_TESTS != 'false')
        run: 'true'
      - name: approval-policy
        if: steps.predict.outputs.skip != 'true' && (env.APPROVE_POLICY != 'false')
        run: 'true'
      - name: approval-inconclusive
        if: steps.predict.outputs.skip != 'true' && (env.APPROVE_INCONCLUSIVE != 'false')
        run: 'true'
      - name: approval-coverage
        if: steps.predict.outputs.skip != 'true' && (env.APPROVE_COVERAGE != 'false')
        run: 'true'
      # Which labels verify says it waits for (its `needs` output), so the pocp status can name
      # them all, with one command to add them. They change only that text, never the result.
      - name: needs-tests
        if: steps.predict.outputs.skip != 'true' && (contains(steps.verify.outputs.approvable == 'true' && steps.verify.outputs.approvable_needs || steps.verify.outputs.needs, 'pocp-approve-tests'))
        run: 'true'
      - name: needs-policy
        if: steps.predict.outputs.skip != 'true' && (contains(steps.verify.outputs.approvable == 'true' && steps.verify.outputs.approvable_needs || steps.verify.outputs.needs, 'pocp-approve-policy'))
        run: 'true'
      - name: needs-inconclusive
        if: steps.predict.outputs.skip != 'true' && (contains(steps.verify.outputs.approvable == 'true' && steps.verify.outputs.approvable_needs || steps.verify.outputs.needs, 'pocp-approve-inconclusive'))
        run: 'true'
      # The wait is for the approvals above only, and they are all listed: the reporter turns it
      # green once each is given, without running verify again. The action reports this only
      # with isolate: true, from a file verify writes where isolated checks can't reach.
      - name: approvable
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outputs.approvable == 'true')
        run: 'true'
      # What the test guard found, for the words on the pocp status and the reporter's comment
      # (never the result): from the same file, so only with the approvable step above.
      - name: verdict-behavior-changed
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outputs.approvable == 'true' && steps.verify.outputs.approvable_verdict == 'behavior-changed')
        run: 'true'
      - name: verdict-detection-dropped
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outputs.approvable == 'true' && steps.verify.outputs.approvable_verdict == 'detection-dropped')
        run: 'true'
      - name: verdict-baseline-red
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outputs.approvable == 'true' && steps.verify.outputs.approvable_verdict == 'baseline-red')
        run: 'true'
      - name: verdict-needs-review
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outputs.approvable == 'true' && steps.verify.outputs.approvable_verdict == 'needs-review')
        run: 'true'
      # What an approval of this head binds to, so a label survives "Update branch" when the pull
      # request's own changes didn't change (sticky approvals, docs/REFERENCE.md). The action
      # reports these only with isolate: true, from a file isolated checks can't reach.
      - name: pocp-held tests ${{ steps.verify.outputs.held_tests }}
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outputs.held_tests != '')
        run: 'true'
      - name: pocp-approval pocp-approve-tests ${{ steps.verify.outputs.approval_tests }}
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outputs.approval_tests != '')
        run: 'true'
      - name: pocp-approval pocp-approve-policy ${{ steps.verify.outputs.approval_policy }}
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outputs.approval_policy != '')
        run: 'true'
      # Exactly one of these runs. Green needs the verify step's own success; the code output
      # only picks waiting / inconclusive / failed. A missing or unknown code is a failure.
      - name: verified
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outcome == 'success' && steps.verify.outputs.code == '0')
        run: 'true'
      - name: waiting
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outputs.code == '4')
        run: |
          echo "::notice title=POCP::waiting for a maintainer's approval (see the summary above)"
          exit "$WAIT_EXIT"
      - name: inconclusive
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outputs.code == '5')
        run: |
          echo "::notice title=POCP::a check didn't finish: re-run this job, or a maintainer approves with pocp-approve-inconclusive"
          exit "$WAIT_EXIT"
      - name: failed
        if: steps.predict.outputs.skip != 'true' && (steps.verify.outputs.code != '4' && steps.verify.outputs.code != '5' && (steps.verify.outcome != 'success' || steps.verify.outputs.code != '0'))
        run: exit 1
#
# Faster, but trusting: run your tests through `pocp ci-run --results ci-results.jsonl -- <cmd>`
# in this job before verify, and pass `ci-results: ci-results.jsonl`. The tests then run once
# instead of twice. Use it only if you accept that anything that runs earlier in the job can
# write that file.
#
# Which findings fail and which CI results are required come from .proof/config.json
# ("verify.fail_on", "verify.require_ci"), not from this file.
#
# Pull requests from forks run the repo's own commands. Treat this job like your test job for
# outside contributors: no secrets, read-only permissions.
