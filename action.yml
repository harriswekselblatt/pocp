name: POCP verify
description: Verify Proof-Of-Change trailers on every commit in a pull request, re-running their proofs.
branding:
  icon: check-circle
  color: green
inputs:
  range:
    description: "Commit range to verify. Defaults to the pull request's base..head. Required on any event that isn't a pull request (for a push, for example: the event's before..after shas)."
    required: false
    default: ''
  rerun:
    description: "Re-run mode: all (verify runs every required check itself; the default), unsigned (skip proofs signed by a key in .proof/allowed_signers), or none."
    required: false
    default: 'all'
  ci-results:
    description: "Faster, trusting mode. Path to a results file written by `pocp ci-run` earlier in the job; checks with a passing result for the same code and command aren't re-run. This trusts everything that ran in the job before verify: a new test in the pull request can append a passing result for any check. Leave empty (the default) to re-run every check."
    required: false
    default: ''
  accept-policy-change:
    description: "'true' only when a maintainer approved loosening .proof/ rules or signers (for example with a label), or the head commit's sha that approval was given for: a sha approves only that head, never a later push."
    required: false
    default: 'false'
  accept-test-change:
    description: "'true' only when a maintainer approved changes to existing tests or test setup (separate from policy approval), or the head commit's sha that approval was given for: a sha approves only that head, never a later push."
    required: false
    default: 'false'
  accept-inconclusive:
    description: "'true' or the head commit's sha, only when a maintainer approved a test change whose check didn't finish (timed out, killed). A test approval doesn't cover that. A sha approves only that head."
    required: false
    default: 'false'
  accept-uncovered:
    description: "'true' or the head commit's sha, only when a maintainer approved the commits .proof/exceptions.json lists as having no proof. A sha approves only that head."
    required: false
    default: 'false'
  exit-detail:
    description: "'true' to also report verify's result as the `code` output: 0 verified, 4 only an approval is missing, 5 something didn't finish, anything else a failure. The step still fails on anything but verified, so give it `continue-on-error: true` and use the verified / waiting / inconclusive / failed steps in examples/github/pocp.yml. Only the step's outcome means verified: the code may only choose between waiting, inconclusive and failed (without isolation, the checks share the job's user and could write to the output file). (Up to v1.0.0 the step passed with exit-detail; a workflow written for that still never turns a failure green, but shows a wait as a failure until it is updated.) 'false' (the default): no code output."
    required: false
    default: 'false'
  isolate:
    description: "'true' (the default, the secure profile): run every check verify re-runs as a fresh unprivileged Linux user that can't reach the verifier, this job's files and tokens, or verify's processes. Needs a Linux runner with passwordless sudo (GitHub-hosted Ubuntu runners have it); if isolation can't be set up, the step fails rather than run checks as the job's user. Toolchains must be installed outside $HOME (setup-node and the other setup actions are). 'false': the cooperative runner, checks run as the job's user (not a security boundary; see docs/THREAT-MODEL.md)."
    required: false
    default: 'true'
  install:
    description: "Command that installs dependencies (for example: npm ci), run isolated at the pull request's head before the checks. The folders .proof/config.json's snapshot.link names (node_modules by default) are then sealed read-only and linked into every check. Needs isolate. Don't install dependencies in an earlier step: that runs the pull request's install scripts as the job's user."
    required: false
    default: ''
  require-coverage:
    description: Fail commits whose changed files needed a packet but had none.
    required: false
    default: 'true'
  pocp-command:
    description: "Command to run pocp with, instead of the copy bundled with this action (for example: node verifier/bin/pocp.js). It is split into words on whitespace, without shell expansion (no quotes, globs or variables). The bundled copy is pinned by the ref you use the action at (uses: harriswekselblatt/pocp@<commit>)."
    required: false
    default: ''
outputs:
  code:
    description: "verify's exit code, with exit-detail: 4 waiting for approval, 5 inconclusive, anything else failed. Not proof of verified: only the step's outcome is."
    value: ${{ steps.verify.outputs.code }}
runs:
  using: composite
  steps:
    - name: Verify
      id: verify
      shell: bash
      env:
        RANGE_INPUT: ${{ inputs.range }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        EVENT_NAME: ${{ github.event_name }}
        RERUN: ${{ inputs.rerun }}
        CI_RESULTS: ${{ inputs.ci-results }}
        ACCEPT_POLICY: ${{ inputs.accept-policy-change }}
        ACCEPT_TESTS: ${{ inputs.accept-test-change }}
        ACCEPT_INCONCLUSIVE: ${{ inputs.accept-inconclusive }}
        ACCEPT_UNCOVERED: ${{ inputs.accept-uncovered }}
        EXIT_DETAIL: ${{ inputs.exit-detail }}
        COVERAGE: ${{ inputs.require-coverage }}
        ISOLATE: ${{ inputs.isolate }}
        INSTALL: ${{ inputs.install }}
        POCP_CMD: ${{ inputs.pocp-command }}
      run: |
        if [ -n "$RANGE_INPUT" ]; then RANGE=$RANGE_INPUT
        elif [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ]; then RANGE="$PR_BASE..$PR_HEAD"
        else
          echo "::error title=POCP verify::no commit range: this ${EVENT_NAME:-} event isn't a pull request, so set the action's range input (for a push: the event's before..after shas)"
          exit 2
        fi
        args=(verify "$RANGE")
        [ "$RERUN" = "all" ] && args+=(--rerun)
        [ "$RERUN" = "unsigned" ] && args+=(--rerun-unsigned)
        [ -n "$CI_RESULTS" ] && args+=(--ci-results "$CI_RESULTS")
        [ -n "$ACCEPT_POLICY" ] && [ "$ACCEPT_POLICY" != "false" ] && args+=("--accept-policy-change=$ACCEPT_POLICY")
        [ -n "$ACCEPT_TESTS" ] && [ "$ACCEPT_TESTS" != "false" ] && args+=("--accept-test-change=$ACCEPT_TESTS")
        [ -n "$ACCEPT_INCONCLUSIVE" ] && [ "$ACCEPT_INCONCLUSIVE" != "false" ] && args+=("--accept-inconclusive=$ACCEPT_INCONCLUSIVE")
        [ -n "$ACCEPT_UNCOVERED" ] && [ "$ACCEPT_UNCOVERED" != "false" ] && args+=("--accept-uncovered=$ACCEPT_UNCOVERED")
        [ "$COVERAGE" = "true" ] && args+=(--require-coverage)
        # Isolation fails closed: an unknown value is an error, not a quiet "false".
        case "$ISOLATE" in
          true) args+=(--isolate) ;;
          false) echo "::warning title=POCP isolation::isolate is false: the checks run as this job's own user (cooperative runner), not the secure profile" ;;
          *) echo "::error title=POCP verify::isolate must be 'true' or 'false', not '$ISOLATE'"; exit 2 ;;
        esac
        [ -n "$INSTALL" ] && args+=(--install "$INSTALL")
        # pocp-command is split into words, without globbing or any other shell expansion.
        cmd=()
        if [ -n "$POCP_CMD" ]; then read -r -a cmd <<< "$POCP_CMD"; fi
        run_verify() {
          if [ "${#cmd[@]}" -gt 0 ]; then "${cmd[@]}" "$@"
          else node "$GITHUB_ACTION_PATH/bin/pocp.js" "$@"; fi
        }
        if [ "$EXIT_DETAIL" = "true" ]; then
          # The step's outcome is verify's own exit status: the one result the checks it runs
          # can't write. The code output (which they could append to) only tells the workflow
          # which kind of not-verified this was.
          set +e
          run_verify "${args[@]}" --exit-detail
          code=$?
          set -e
          echo "code=$code" >> "${GITHUB_OUTPUT:-/dev/null}"
          exit "$code"
        else
          run_verify "${args[@]}"
        fi
