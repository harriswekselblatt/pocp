name: POCP verify
description: Verify Proof-Of-Change trailers on every commit in a pull request, re-running their proofs.
branding:
  icon: check-circle
  color: green
inputs:
  range:
    description: Commit range to verify. Defaults to the pull request's base..head.
    required: false
    default: ''
  rerun:
    description: "Re-run mode: all (verify runs every required check itself; the default), unsigned (skip proofs signed by a key in .proof/allowed_signers), or none."
    required: false
    default: 'all'
  ci-results:
    description: "Faster, trusting mode. Path to a results file written by `pocp ci-run` earlier in the job; checks with a passing result for the same code and command aren't re-run. This trusts everything that ran in the job before verify: a new test in the pull request can append a passing result for any check. Leave empty (the default) to re-run every check."
    required: false
    default: ''
  accept-policy-change:
    description: "'true' only when a maintainer approved loosening .proof/ rules or signers (for example with a label), or the head commit's sha that approval was given for: a sha approves only that head, never a later push."
    required: false
    default: 'false'
  accept-test-change:
    description: "'true' only when a maintainer approved changes to existing tests or test setup (separate from policy approval), or the head commit's sha that approval was given for: a sha approves only that head, never a later push."
    required: false
    default: 'false'
  require-coverage:
    description: Fail commits whose changed files needed a packet but had none.
    required: false
    default: 'true'
  pocp-command:
    description: "Command to run pocp with, instead of the copy bundled with this action (for example: node verifier/bin/pocp.js). The bundled copy is pinned by the ref you use the action at (uses: harriswekselblatt/pocp@<commit>)."
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Verify
      shell: bash
      env:
        RANGE: ${{ inputs.range != '' && inputs.range || format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
        RERUN: ${{ inputs.rerun }}
        CI_RESULTS: ${{ inputs.ci-results }}
        ACCEPT_POLICY: ${{ inputs.accept-policy-change }}
        ACCEPT_TESTS: ${{ inputs.accept-test-change }}
        COVERAGE: ${{ inputs.require-coverage }}
        POCP_CMD: ${{ inputs.pocp-command }}
      run: |
        args=(verify "$RANGE")
        [ "$RERUN" = "all" ] && args+=(--rerun)
        [ "$RERUN" = "unsigned" ] && args+=(--rerun-unsigned)
        [ -n "$CI_RESULTS" ] && args+=(--ci-results "$CI_RESULTS")
        [ -n "$ACCEPT_POLICY" ] && [ "$ACCEPT_POLICY" != "false" ] && args+=("--accept-policy-change=$ACCEPT_POLICY")
        [ -n "$ACCEPT_TESTS" ] && [ "$ACCEPT_TESTS" != "false" ] && args+=("--accept-test-change=$ACCEPT_TESTS")
        [ "$COVERAGE" = "true" ] && args+=(--require-coverage)
        if [ -n "$POCP_CMD" ]; then $POCP_CMD "${args[@]}"
        else node "$GITHUB_ACTION_PATH/bin/pocp.js" "${args[@]}"; fi
